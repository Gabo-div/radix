<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CUBO DASH</title>
<style>
  :root{
    --bg-top:#1a0b2e;
    --bg-bot:#0d0517;
    --accent:#00f0ff;
    --accent2:#ff2e88;
    --gold:#ffd23f;
    --ground:#12081f;
    --panel:#150a24;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;height:100%;
    background:#000;
    font-family:'Courier New', monospace;
    overflow:hidden;
    color:#fff;
  }
  #wrap{
    position:relative;
    width:100vw;height:100vh;
    display:flex;align-items:center;justify-content:center;
  }
  canvas{
    display:block;
    image-rendering:pixelated;
    box-shadow:0 0 60px rgba(0,240,255,0.15);
    border:2px solid #2a1a44;
  }
  #hud{
    position:absolute;top:18px;left:0;right:0;
    display:flex;justify-content:space-between;
    padding:0 28px;
    pointer-events:none;
    letter-spacing:2px;
  }
  #hud .tag{
    font-size:13px;color:var(--accent);
    text-shadow:0 0 8px var(--accent);
  }
  #hud .lvl{
    font-size:13px;color:var(--gold);
    text-shadow:0 0 8px var(--gold);
  }
  #progressBar{
    position:absolute;top:0;left:0;right:0;height:5px;
    background:rgba(255,255,255,0.06);
  }
  #progressFill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--accent2),var(--accent));
    box-shadow:0 0 10px var(--accent);
    transition:width .05s linear;
  }
  #overlay{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    background:rgba(5,2,12,0.88);
    text-align:center;
    gap:16px;
    z-index:5;
  }
  #overlay.hidden{display:none;}
  #overlay h1{
    margin:0;
    font-size:38px;
    letter-spacing:6px;
    color:var(--accent);
    text-shadow:0 0 20px var(--accent), 0 0 40px var(--accent2);
  }
  #overlay .sub{
    font-size:13px;color:#9a8fc9;letter-spacing:2px;max-width:420px;line-height:1.6;
  }
  #overlay .msg{
    font-size:16px;color:var(--gold);letter-spacing:2px;min-height:20px;
  }
  button{
    font-family:inherit;
    background:transparent;
    border:2px solid var(--accent);
    color:var(--accent);
    padding:12px 28px;
    font-size:14px;
    letter-spacing:3px;
    cursor:pointer;
    text-shadow:0 0 6px var(--accent);
    box-shadow:0 0 12px rgba(0,240,255,0.3) inset;
    transition:.15s;
  }
  button:hover{
    background:var(--accent);
    color:#000;
    text-shadow:none;
  }
  .dots{display:flex;gap:8px;margin-top:6px;}
  .dot{
    width:10px;height:10px;border-radius:50%;
    border:2px solid #4a3a6b;
  }
  .dot.on{
    background:var(--accent2);
    border-color:var(--accent2);
    box-shadow:0 0 8px var(--accent2);
  }
  #hint{
    position:absolute;bottom:14px;left:0;right:0;
    text-align:center;
    font-size:11px;color:#5c4d80;
    letter-spacing:2px;
    pointer-events:none;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="900" height="500"></canvas>
  <div id="progressBar"><div id="progressFill"></div></div>
  <div id="hud">
    <div class="tag">INTENTOS: <span id="attempts">0</span></div>
    <div class="lvl">NIVEL <span id="levelNum">1</span> / 3</div>
  </div>
  <div id="hint">ESPACIO / CLIC / TOQUE PARA SALTAR</div>

  <div id="overlay">
    <h1>CUBO DASH</h1>
    <div class="sub">Salta sobre los picos, esquiva los bloques y llega al final de los 3 niveles. Un toque y explotas &mdash; memoriza el camino.</div>
    <div class="dots" id="levelDots">
      <div class="dot on"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <div class="msg" id="overlayMsg"></div>
    <button id="startBtn">JUGAR</button>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const GROUND_Y = H - 90;

  const overlay = document.getElementById('overlay');
  const overlayMsg = document.getElementById('overlayMsg');
  const startBtn = document.getElementById('startBtn');
  const attemptsEl = document.getElementById('attempts');
  const levelNumEl = document.getElementById('levelNum');
  const progressFill = document.getElementById('progressFill');
  const dotsEls = document.querySelectorAll('#levelDots .dot');

  // ---------- Level definitions ----------
  // Each obstacle: {type:'spike'|'block'|'gap'|'ceilSpike', x, w, h}
  // Coordinates are "world x" in game units; player has fixed screen x.
  function buildLevel(id){
    const obs = [];
    let x = 700;
    const speedFactor = id === 1 ? 1 : id === 2 ? 1 : 1;

    if(id === 1){
      // gentle intro: spikes and one block, wide spacing
      const pattern = [
        ['spike',0],['gap',260],['spike',0],['spike',60],['gap',260],
        ['block',0],['gap',240],['spike',0],['gap',300],
        ['spike',0],['spike',60],['spike',60],['gap',300],
        ['block',0],['block',70],['gap',280],
        ['spike',0],['gap',260]
      ];
      pattern.forEach(p=>{
        if(p[0]==='gap'){ x += p[1]; return; }
        if(p[0]==='spike'){ obs.push({type:'spike',x:x,w:34,h:34}); x += 34+p[1]; }
        if(p[0]==='block'){ obs.push({type:'block',x:x,w:46,h:46}); x += 46+p[1]; }
      });
    } else if(id === 2){
      // faster, tighter, double spikes, ceiling spikes appear
      const pattern = [
        ['spike',0],['spike',34],['gap',220],
        ['block',0],['gap',210],
        ['spike',0],['gap',180],['spike',0],['gap',180],['spike',0],['gap',240],
        ['ceilSpike',0],['gap',220],
        ['block',0],['gap',90],['spike',0],['gap',240],
        ['spike',0],['spike',34],['spike',34],['gap',260],
        ['block',0],['block',56],['gap',230],
        ['spike',0],['gap',200],['ceilSpike',0],['gap',220]
      ];
      pattern.forEach(p=>{
        if(p[0]==='gap'){ x += p[1]; return; }
        if(p[0]==='spike'){ obs.push({type:'spike',x:x,w:34,h:34}); x += 34+p[1]; }
        if(p[0]==='block'){ obs.push({type:'block',x:x,w:46,h:46}); x += 46+p[1]; }
        if(p[0]==='ceilSpike'){ obs.push({type:'ceilSpike',x:x,w:34,h:34}); x += 34+p[1]; }
      });
    } else {
      // hardest: rapid triples, mixed ceiling/ground, small gaps
      const pattern = [
        ['spike',0],['spike',34],['spike',34],['gap',200],
        ['ceilSpike',0],['gap',170],
        ['block',0],['gap',180],['spike',0],['gap',170],
        ['spike',0],['spike',34],['gap',210],
        ['block',0],['block',56],['gap',210],
        ['ceilSpike',0],['gap',210],['spike',0],['gap',210],['ceilSpike',0],['gap',210],
        ['spike',0],['spike',34],['spike',34],['spike',34],['gap',240],
        ['block',0],['gap',190],['spike',0],['gap',180],
        ['ceilSpike',0],['gap',170],['spike',0],['spike',34],['gap',260]
      ];
      pattern.forEach(p=>{
        if(p[0]==='gap'){ x += p[1]; return; }
        if(p[0]==='spike'){ obs.push({type:'spike',x:x,w:34,h:34}); x += 34+p[1]; }
        if(p[0]==='block'){ obs.push({type:'block',x:x,w:46,h:46}); x += 46+p[1]; }
        if(p[0]==='ceilSpike'){ obs.push({type:'ceilSpike',x:x,w:34,h:34}); x += 34+p[1]; }
      });
    }
    const baseSpeed = id===1?2.6:id===2?3.2:3.8;
    const maxSpeed  = id===1?4.6:id===2?5.8:6.8;
    return { obstacles: obs, length: x + 400, baseSpeed, maxSpeed };
  }

  const levels = [buildLevel(1), buildLevel(2), buildLevel(3)];

  // ---------- Game state ----------
  let state = 'menu'; // menu, playing, dead, won, levelComplete, allDone
  let currentLevel = 0;
  let attempts = 0;
  let scrollX = 0;
  let player, particles = [], groundParticles = [], bgStars;
  let jumpBuffered = false;
  let shakeT = 0;
  let elapsedFrames = 0;
  let currentSpeed = 0;

  const PLAYER_SCREEN_X = 160;
  const GRAVITY = 0.62;
  const JUMP_V = -11.2;
  const PLAYER_SIZE = 32;

  function resetPlayer(){
    player = {
      y: GROUND_Y - PLAYER_SIZE,
      vy: 0,
      rot: 0,
      onGround: true,
      dead: false,
      trail: []
    };
  }

  function initStars(){
    bgStars = [];
    for(let i=0;i<60;i++){
      bgStars.push({
        x: Math.random()*W,
        y: Math.random()*(H-90),
        r: Math.random()*1.8+0.4,
        tw: Math.random()*Math.PI*2
      });
    }
  }
  initStars();

  function startLevel(idx){
    currentLevel = idx;
    scrollX = 0;
    elapsedFrames = 0;
    currentSpeed = levels[idx].baseSpeed;
    resetPlayer();
    particles = [];
    groundParticles = [];
    state = 'playing';
    overlay.classList.add('hidden');
    levelNumEl.textContent = (idx+1);
    updateDots(idx);
  }

  function updateDots(idx){
    dotsEls.forEach((d,i)=>{
      d.classList.toggle('on', i<=idx);
    });
  }

  function die(){
    if(player.dead) return;
    player.dead = true;
    state = 'dead';
    attempts++;
    attemptsEl.textContent = attempts;
    shakeT = 14;
    // explosion particles
    for(let i=0;i<26;i++){
      const ang = Math.random()*Math.PI*2;
      const spd = Math.random()*4.5+1.5;
      particles.push({
        x: PLAYER_SCREEN_X+PLAYER_SIZE/2,
        y: player.y+PLAYER_SIZE/2,
        vx: Math.cos(ang)*spd,
        vy: Math.sin(ang)*spd,
        life: 40+Math.random()*20,
        color: Math.random()<0.5? '#00f0ff':'#ff2e88'
      });
    }
    setTimeout(()=>{
      showOverlay(
        'PERDISTE',
        'Chocaste en el nivel '+(currentLevel+1)+'. Intenta memorizar el patrón.',
        'REINTENTAR'
      );
    }, 550);
  }

  function completeLevel(){
    state = 'levelComplete';
    if(currentLevel < 2){
      setTimeout(()=>{
        showOverlay(
          '¡NIVEL '+(currentLevel+1)+' SUPERADO!',
          'Prepárate, el nivel '+(currentLevel+2)+' es más rápido.',
          'SIGUIENTE NIVEL',
          true
        );
      }, 300);
    } else {
      setTimeout(()=>{
        showOverlay(
          '¡JUEGO COMPLETADO!',
          'Superaste los 3 niveles de CUBO DASH en '+attempts+' intentos totales. Eres imparable.',
          'JUGAR DE NUEVO'
        );
        currentLevel = -1; // so start goes to level 0
      }, 300);
    }
  }

  function showOverlay(title, sub, btnText, isNext){
    overlay.querySelector('h1').textContent = title;
    overlay.querySelector('.sub').textContent = sub;
    overlayMsg.textContent = '';
    startBtn.textContent = btnText;
    overlay.classList.remove('hidden');
    startBtn.onclick = ()=>{
      if(isNext){
        startLevel(currentLevel+1);
      } else if(title === '¡JUEGO COMPLETADO!'){
        startLevel(0);
      } else {
        startLevel(currentLevel);
      }
    };
  }

  // ---------- Input ----------
  function doJump(){
    if(state !== 'playing') return;
    if(player.onGround){
      player.vy = JUMP_V;
      player.onGround = false;
    }
  }

  window.addEventListener('keydown', (e)=>{
    if(e.code === 'Space' || e.code==='ArrowUp'){
      e.preventDefault();
      doJump();
    }
  });
  canvas.addEventListener('mousedown', doJump);
  canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); doJump(); }, {passive:false});

  startBtn.addEventListener('click', ()=>{
    if(state === 'menu'){
      startLevel(0);
    }
  });

  // ---------- Collision ----------
  function checkCollisions(level){
    const px = PLAYER_SCREEN_X;
    const pw = PLAYER_SIZE, ph = PLAYER_SIZE;
    const py = player.y;

    for(const o of level.obstacles){
      const ox = o.x - scrollX;
      if(ox > px + pw + 40) break; // sorted-ish, but safe margin
      if(ox + o.w < px - 20) continue;

      if(o.type === 'block'){
        const oy = GROUND_Y - o.h;
        if(rectsOverlap(px,py,pw,ph, ox,oy,o.w,o.h)){
          die(); return;
        }
      } else if(o.type === 'spike'){
        // triangle spike sitting on ground; approximate with shrunk hitbox
        const oy = GROUND_Y - o.h;
        if(spikeOverlap(px,py,pw,ph, ox,oy,o.w,o.h)){
          die(); return;
        }
      } else if(o.type === 'ceilSpike'){
        const oy = 0;
        if(spikeOverlap(px,py,pw,ph, ox,oy,o.w,o.h,true)){
          die(); return;
        }
      }
    }
  }

  function rectsOverlap(ax,ay,aw,ah, bx,by,bw,bh){
    const pad = 4;
    return ax+pad < bx+bw && ax+aw-pad > bx && ay+pad < by+bh && ay+ah-pad > by;
  }

  function spikeOverlap(ax,ay,aw,ah, bx,by,bw,bh, ceiling){
    // shrink spike hitbox to roughly the triangle body
    const shrink = bw*0.28;
    const sx = bx+shrink, sw = bw-shrink*2;
    const sy = ceiling ? by : by+bh*0.25;
    const sh = ceiling ? bh*0.75 : bh*0.75;
    return rectsOverlap(ax,ay,aw,ah, sx,sy,sw,sh);
  }

  // ---------- Update ----------
  function update(){
    if(state !== 'playing') return;
    const level = levels[currentLevel];

    // physics
    player.vy += GRAVITY;
    player.y += player.vy;
    if(player.y >= GROUND_Y - PLAYER_SIZE){
      player.y = GROUND_Y - PLAYER_SIZE;
      player.vy = 0;
      if(!player.onGround){
        // landing dust
        for(let i=0;i<6;i++){
          groundParticles.push({
            x: PLAYER_SCREEN_X+Math.random()*PLAYER_SIZE,
            y: GROUND_Y,
            vx:(Math.random()-0.5)*2,
            vy:-Math.random()*2,
            life:20
          });
        }
      }
      player.onGround = true;
    } else {
      player.onGround = false;
    }

    if(!player.onGround){
      player.rot += 0.15;
    } else {
      player.rot = Math.round(player.rot / (Math.PI/2)) * (Math.PI/2);
    }

    // la velocidad sube poco a poco desde baseSpeed hasta maxSpeed
    elapsedFrames++;
    const rampDuration = 480; // ~8 segundos a 60fps para llegar al tope
    const rampT = Math.min(1, elapsedFrames / rampDuration);
    currentSpeed = level.baseSpeed + (level.maxSpeed - level.baseSpeed) * rampT;
    scrollX += currentSpeed;

    // trail
    player.trail.push({x:PLAYER_SCREEN_X, y:player.y});
    if(player.trail.length > 8) player.trail.shift();

    checkCollisions(level);

    if(scrollX >= level.length - 260){
      completeLevel();
    }

    // progress bar
    const pct = Math.min(100, (scrollX/(level.length-260))*100);
    progressFill.style.width = pct+'%';
  }

  function updateParticles(){
    for(const p of particles){
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.15;
      p.life--;
    }
    particles = particles.filter(p=>p.life>0);
    for(const g of groundParticles){
      g.x += g.vx; g.y += g.vy;
      g.vy += 0.1;
      g.life--;
    }
    groundParticles = groundParticles.filter(g=>g.life>0);
  }

  // ---------- Draw ----------
  function draw(){
    ctx.clearRect(0,0,W,H);

    // background gradient
    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#1a0b2e');
    grad.addColorStop(1,'#0d0517');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    // stars
    const t = Date.now()/500;
    bgStars.forEach(s=>{
      const a = 0.4 + Math.sin(t+s.tw)*0.3;
      ctx.fillStyle = `rgba(180,160,255,${Math.max(0,a)})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
    });

    // parallax mountains
    ctx.save();
    let shakeX = 0, shakeY = 0;
    if(shakeT > 0){
      shakeX = (Math.random()-0.5)*shakeT;
      shakeY = (Math.random()-0.5)*shakeT;
      shakeT -= 1;
      ctx.translate(shakeX, shakeY);
    }

    drawParallax();

    // ground
    ctx.fillStyle = '#0a0512';
    ctx.fillRect(0, GROUND_Y, W, H-GROUND_Y);
    ctx.fillStyle = '#1c1030';
    ctx.fillRect(0, GROUND_Y, W, 4);
    ctx.strokeStyle = 'rgba(0,240,255,0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0,GROUND_Y+1); ctx.lineTo(W,GROUND_Y+1); ctx.stroke();

    // ground tick marks scrolling
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    const tickSpacing = 40;
    const offset = scrollX % tickSpacing;
    for(let x = -offset; x < W; x += tickSpacing){
      ctx.beginPath();
      ctx.moveTo(x, GROUND_Y+6);
      ctx.lineTo(x, H);
      ctx.stroke();
    }

    if(state === 'playing' || state === 'dead' || state === 'levelComplete'){
      const level = levels[currentLevel];
      drawObstacles(level);
    }

    // ground particles
    groundParticles.forEach(g=>{
      ctx.fillStyle = `rgba(255,255,255,${g.life/20})`;
      ctx.fillRect(g.x, g.y, 3, 3);
    });

    // player trail
    if(state==='playing' && player){
      player.trail.forEach((p,i)=>{
        const alpha = (i/player.trail.length)*0.35;
        ctx.fillStyle = `rgba(0,240,255,${alpha})`;
        ctx.fillRect(p.x+6, p.y+6, PLAYER_SIZE-12, PLAYER_SIZE-12);
      });
    }

    // player
    if((state==='playing' || state==='dead') && player && !(player.dead && shakeT<=0 && state==='dead' && false)){
      if(!(player.dead && particles.length===0 && state==='dead')){
        drawPlayer();
      }
    }

    // death particles
    particles.forEach(p=>{
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, p.life/60);
      ctx.fillRect(p.x, p.y, 4, 4);
      ctx.globalAlpha = 1;
    });

    ctx.restore();
  }

  function drawParallax(){
    ctx.fillStyle = 'rgba(60,30,90,0.35)';
    const baseOff = (scrollX*0.15) % 220;
    for(let i=-1;i<6;i++){
      const x = i*220 - baseOff;
      ctx.beginPath();
      ctx.moveTo(x, GROUND_Y);
      ctx.lineTo(x+110, GROUND_Y-90);
      ctx.lineTo(x+220, GROUND_Y);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(90,40,120,0.3)';
    const baseOff2 = (scrollX*0.3) % 160;
    for(let i=-1;i<8;i++){
      const x = i*160 - baseOff2;
      ctx.beginPath();
      ctx.moveTo(x, GROUND_Y);
      ctx.lineTo(x+80, GROUND_Y-50);
      ctx.lineTo(x+160, GROUND_Y);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawObstacles(level){
    for(const o of level.obstacles){
      const ox = o.x - scrollX;
      if(ox > W + 50 || ox < -80) continue;

      if(o.type === 'block'){
        const oy = GROUND_Y - o.h;
        const g = ctx.createLinearGradient(ox,oy,ox,oy+o.h);
        g.addColorStop(0,'#ff2e88');
        g.addColorStop(1,'#7a0d42');
        ctx.fillStyle = g;
        ctx.fillRect(ox,oy,o.w,o.h);
        ctx.strokeStyle = '#ffd23f';
        ctx.lineWidth = 2;
        ctx.strokeRect(ox+2,oy+2,o.w-4,o.h-4);
      } else if(o.type === 'spike'){
        const oy = GROUND_Y - o.h;
        ctx.beginPath();
        ctx.moveTo(ox, oy+o.h);
        ctx.lineTo(ox+o.w/2, oy);
        ctx.lineTo(ox+o.w, oy+o.h);
        ctx.closePath();
        const g = ctx.createLinearGradient(ox,oy,ox,oy+o.h);
        g.addColorStop(0,'#00f0ff');
        g.addColorStop(1,'#0a5a66');
        ctx.fillStyle = g;
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.stroke();
      } else if(o.type === 'ceilSpike'){
        const oy = 0;
        ctx.beginPath();
        ctx.moveTo(ox, oy);
        ctx.lineTo(ox+o.w/2, oy+o.h);
        ctx.lineTo(ox+o.w, oy);
        ctx.closePath();
        const g = ctx.createLinearGradient(ox,oy,ox,oy+o.h);
        g.addColorStop(0,'#ffd23f');
        g.addColorStop(1,'#8a5a00');
        ctx.fillStyle = g;
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
  }

  function drawPlayer(){
    ctx.save();
    ctx.translate(PLAYER_SCREEN_X+PLAYER_SIZE/2, player.y+PLAYER_SIZE/2);
    ctx.rotate(player.rot);
    const half = PLAYER_SIZE/2;
    const g = ctx.createLinearGradient(-half,-half,half,half);
    g.addColorStop(0,'#00f0ff');
    g.addColorStop(1,'#0090a8');
    ctx.fillStyle = g;
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 16;
    ctx.fillRect(-half,-half,PLAYER_SIZE,PLAYER_SIZE);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.strokeRect(-half+3,-half+3,PLAYER_SIZE-6,PLAYER_SIZE-6);
    // eye
    ctx.fillStyle = '#0d0517';
    ctx.fillRect(half*0.15, -half*0.5, 6, 6);
    ctx.restore();
  }

  // ---------- Main loop ----------
  function loop(){
    update();
    updateParticles();
    draw();
    requestAnimationFrame(loop);
  }
  loop();

})();
</script>
