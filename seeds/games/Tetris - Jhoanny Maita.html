<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetris en HTML5</title>
    <style>
      body {
        background-color: #202028;
        color: #fff;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }
      #game-container {
        display: flex;
        gap: 20px;
        align-items: flex-start;
      }
      canvas {
        border: 2px solid #fff;
        background-color: #000;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      }
      .ui {
        background: #333;
        padding: 20px;
        border-radius: 8px;
        text-align: center;
        min-width: 150px;
      }
      h1 {
        margin: 0 0 20px 0;
        font-size: 24px;
        letter-spacing: 2px;
      }
      #score {
        font-size: 32px;
        font-weight: bold;
        color: #00ff00;
      }
      .controls {
        margin-top: 20px;
        font-size: 14px;
        color: #aaa;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <!-- El lienzo donde se dibuja el juego -->
      <canvas id="tetris" width="240" height="400"></canvas>

      <!-- Panel de puntuación e instrucciones -->
      <div class="ui">
        <h1>TETRIS</h1>
        <div>Puntuación</div>
        <div id="score">0</div>

        <div class="controls">
          <p><b>Controles:</b></p>
          <p>⬅️ ➡️ : Mover</p>
          <p>⬆️ : Rotar</p>
          <p>⬇️ : Bajar rápido</p>
        </div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById("tetris");
      const context = canvas.getContext("2d");

      // Escalar para que los bloques sean de 20x20 píxeles
      context.scale(20, 20);

      // Función para limpiar líneas completas
      function arenaSweep() {
        let rowCount = 1;
        outer: for (let y = arena.length - 1; y > 0; --y) {
          for (let x = 0; x < arena[y].length; ++x) {
            if (arena[y][x] === 0) {
              continue outer;
            }
          }

          const row = arena.splice(y, 1)[0].fill(0);
          arena.unshift(row);
          ++y;

          player.score += rowCount * 10;
          rowCount *= 2;
        }
      }

      // Comprueba si hay colisiones entre la pieza y los bordes o bloques existentes
      function collide(arena, player) {
        const m = player.matrix;
        const o = player.pos;
        for (let y = 0; y < m.length; ++y) {
          for (let x = 0; x < m[y].length; ++x) {
            if (
              m[y][x] !== 0 &&
              (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0
            ) {
              return true;
            }
          }
        }
        return false;
      }

      // Crea el tablero (matriz 2D)
      function createMatrix(w, h) {
        const matrix = [];
        while (h--) {
          matrix.push(new Array(w).fill(0));
        }
        return matrix;
      }

      // Definición de las piezas (Tetrominós)
      function createPiece(type) {
        if (type === "T") {
          return [
            [0, 0, 0],
            [1, 1, 1],
            [0, 1, 0],
          ];
        } else if (type === "O") {
          return [
            [2, 2],
            [2, 2],
          ];
        } else if (type === "L") {
          return [
            [0, 3, 0],
            [0, 3, 0],
            [0, 3, 3],
          ];
        } else if (type === "J") {
          return [
            [0, 4, 0],
            [0, 4, 0],
            [4, 4, 0],
          ];
        } else if (type === "I") {
          return [
            [0, 5, 0, 0],
            [0, 5, 0, 0],
            [0, 5, 0, 0],
            [0, 5, 0, 0],
          ];
        } else if (type === "S") {
          return [
            [0, 6, 6],
            [6, 6, 0],
            [0, 0, 0],
          ];
        } else if (type === "Z") {
          return [
            [7, 7, 0],
            [0, 7, 7],
            [0, 0, 0],
          ];
        }
      }

      // Dibuja la matriz en el canvas
      function drawMatrix(matrix, offset) {
        matrix.forEach((row, y) => {
          row.forEach((value, x) => {
            if (value !== 0) {
              context.fillStyle = colors[value];
              context.fillRect(x + offset.x, y + offset.y, 1, 1);

              // Bordes para los bloques
              context.lineWidth = 0.05;
              context.strokeStyle = "rgba(0,0,0,0.5)";
              context.strokeRect(x + offset.x, y + offset.y, 1, 1);
            }
          });
        });
      }

      // Función principal de dibujo
      function draw() {
        context.fillStyle = "#000";
        context.fillRect(0, 0, canvas.width, canvas.height);

        drawMatrix(arena, { x: 0, y: 0 });
        drawMatrix(player.matrix, player.pos);
      }

      // Transfiere los datos de la pieza al tablero
      function merge(arena, player) {
        player.matrix.forEach((row, y) => {
          row.forEach((value, x) => {
            if (value !== 0) {
              arena[y + player.pos.y][x + player.pos.x] = value;
            }
          });
        });
      }

      // Lógica de caída de la pieza
      function playerDrop() {
        player.pos.y++;
        if (collide(arena, player)) {
          player.pos.y--;
          merge(arena, player);
          playerReset();
          arenaSweep();
          updateScore();
        }
        dropCounter = 0;
      }

      // Mover pieza a los lados
      function playerMove(dir) {
        player.pos.x += dir;
        if (collide(arena, player)) {
          player.pos.x -= dir;
        }
      }

      // Genera una nueva pieza aleatoria
      function playerReset() {
        const pieces = "ILJOTSZ";
        player.matrix = createPiece(
          pieces[(pieces.length * Math.random()) | 0],
        );
        player.pos.y = 0;
        player.pos.x =
          Math.floor(arena[0].length / 2) -
          Math.floor(player.matrix[0].length / 2);

        // Si hay colisión al reaparecer, fin del juego
        if (collide(arena, player)) {
          arena.forEach((row) => row.fill(0));
          player.score = 0;
          updateScore();
        }
      }

      // Lógica de rotación de la matriz
      function playerRotate(dir) {
        const pos = player.pos.x;
        let offset = 1;
        rotate(player.matrix, dir);

        // Ajuste si al rotar choca con la pared (Wall Kick básico)
        while (collide(arena, player)) {
          player.pos.x += offset;
          offset = -(offset + (offset > 0 ? 1 : -1));
          if (offset > player.matrix[0].length) {
            rotate(player.matrix, -dir);
            player.pos.x = pos;
            return;
          }
        }
      }

      // Rota la matriz transponiendo y luego invirtiendo filas
      function rotate(matrix, dir) {
        for (let y = 0; y < matrix.length; ++y) {
          for (let x = 0; x < y; ++x) {
            [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
          }
        }
        if (dir > 0) {
          matrix.forEach((row) => row.reverse());
        } else {
          matrix.reverse();
        }
      }

      let dropCounter = 0;
      let dropInterval = 1000;
      let lastTime = 0;

      // Bucle principal del juego
      function update(time = 0) {
        const deltaTime = time - lastTime;
        lastTime = time;

        dropCounter += deltaTime;
        if (dropCounter > dropInterval) {
          playerDrop();
        }

        draw();
        requestAnimationFrame(update);
      }

      function updateScore() {
        document.getElementById("score").innerText = player.score;
      }

      // Colores de las piezas correspondientes a los números 1-7
      const colors = [
        null,
        "#FF0D72", // T
        "#0DC2FF", // O
        "#0DFF72", // L
        "#F538FF", // J
        "#FF8E0D", // I
        "#FFE138", // S
        "#3877FF", // Z
      ];

      // El tablero es de 12 columnas por 20 filas
      const arena = createMatrix(12, 20);

      const player = {
        pos: { x: 0, y: 0 },
        matrix: null,
        score: 0,
      };

      // Escucha los eventos del teclado
      document.addEventListener("keydown", (event) => {
        if (event.keyCode === 37) {
          // Flecha Izquierda
          playerMove(-1);
        } else if (event.keyCode === 39) {
          // Flecha Derecha
          playerMove(1);
        } else if (event.keyCode === 40) {
          // Flecha Abajo
          playerDrop();
        } else if (event.keyCode === 38) {
          // Flecha Arriba
          playerRotate(1);
        }
      });

      // Inicializar el juego
      playerReset();
      updateScore();
      update();
    </script>
  </body>
</html>
