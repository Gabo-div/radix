<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazhonor</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #2e1d16;
            width: 100vw;
            height: 100vh;
            color: white;

<body>

    <script src="https://unpkg.com/kaplay/dist/kaplay.js"></script>

    <script>
        kaplay({
            background: [93, 161, 48],
            global: true,
            font: "roboto"
        });

        loadFont("roboto", "https://fonts.gstatic.com/s/roboto/v30/KFOmCnqEu92Fr1Mu4mxP.ttf");

        // ESTADO GLOBAL
        let money = 20; 
        let energy = 100;
        const MAX_ENERGY = 100;
        
        function getToolDamage(id) {
            if (!id) return 1;
            if(id.endsWith("_copper")) return 1;
            if(id.endsWith("_iron")) return 2;
            if(id.endsWith("_gold")) return 3;
            if(id.endsWith("_diamond")) return 4;
            return 1;
        }

        let hotbar = [
            { cat: "tool", id: "hoe", name: "Azada", q: 1 },
            { cat: "tool", id: "water", name: "Agua", q: 1 },
            { cat: "tool", id: "axe_copper", name: "Hacha\nCobre", q: 1 },
            { cat: "tool", id: "pickaxe_copper", name: "Pico\nCobre", q: 1 },
            { cat: "seed", id: "seed_tomato", name: "Tomate", q: 3 },
            null, null, null, null
        ];
        let backpack = Array(27).fill(null);
        let backpackLevel = 0;

        function getEmptySlot(arr, max) {
            for(let i=0; i<max; i++) if (!arr[i]) return i;
            return -1;
        }
        function addItem(cat, id, name, q) {
            for(let i=0; i<9; i++) {
                if(hotbar[i] && hotbar[i].id === id) { hotbar[i].q += q; return true; }
            }
            let bps = backpackLevel * 9;
            for(let i=0; i<bps; i++) {
                if(backpack[i] && backpack[i].id === id) { backpack[i].q += q; return true; }
            }
            let hSlot = getEmptySlot(hotbar, 9);
            if(hSlot !== -1) { hotbar[hSlot] = { cat, id, name, q }; return true; }
            let bSlot = getEmptySlot(backpack, bps);
            if(bSlot !== -1) { backpack[bSlot] = { cat, id, name, q }; return true; }
            return false; 
        }
        function countItem(id) {
            let c = 0;
            for(let i=0; i<9; i++) if(hotbar[i] && hotbar[i].id === id) c += hotbar[i].q;
            let bps = backpackLevel * 9;
            for(let i=0; i<bps; i++) if(backpack[i] && backpack[i].id === id) c += backpack[i].q;
            return c;
        }
        function removeItem(id, qty) {
            let left = qty;
            for(let i=0; i<9; i++) {
                if(hotbar[i] && hotbar[i].id === id) {
                    if(hotbar[i].q >= left) { hotbar[i].q -= left; if(hotbar[i].q <= 0) hotbar[i] = null; return true; }
                    else { left -= hotbar[i].q; hotbar[i] = null; }
                }
            }
            let bps = backpackLevel * 9;
            for(let i=0; i<bps; i++) {
                if(backpack[i] && backpack[i].id === id) {
                    if(backpack[i].q >= left) { backpack[i].q -= left; if(backpack[i].q <= 0) backpack[i] = null; return true; }
                    else { left -= backpack[i].q; backpack[i] = null; }
                }
            }
            return false;
        }

        let skills = {
            agricultor: { level: 1, xp: 0, next: 10, name: "Agricultor" },
            jardinero: { level: 1, xp: 0, next: 10, name: "Jardinero" },
            minero: { level: 1, xp: 0, next: 10, name: "Minero" },
            pescador: { level: 1, xp: 0, next: 10, name: "Pescador" },
            herrero: { level: 1, xp: 0, next: 10, name: "Herrero" },
            carpintero: { level: 1, xp: 0, next: 10, name: "Carpintero" },
            botanico: { level: 1, xp: 0, next: 10, name: "Botánico" }
        };
        let currentQuest = 0;

        function addXP(skill, amount) {
            skills[skill].xp += amount;
            if (skills[skill].xp >= skills[skill].next) {
                skills[skill].xp -= skills[skill].next;
                skills[skill].level++;
                skills[skill].next = Math.floor(skills[skill].next * 1.5);
                add([ text(`¡SISTEMA: Nivel de ${skills[skill].name} subió a ${skills[skill].level}!`, { size: 28 }), pos(width()/2, 120), anchor("center"), color(255,215,0), opacity(1), lifespan(4, { fade: 1 }), fixed(), z(500) ]);
            }
        }

        let boatRepaired = false;

        let activeTool = 0; // 0 a 8
        let activeSoilType = "normal"; // "normal", "sand"
        
        let dayTime = 0; 
        let isNight = false;
        let exhaustTimer = 0;

        let placedFurniture = [];
        let globalStorage = Array(27).fill(null); // Cofre con slots

        const FURNITURE_CATALOG = [
            { id: "sofa", name: "Sofá", price: 2000, w: 80, h: 40, c: [100, 100, 200] },
            { id: "tv", name: "Televisor", price: 5000, w: 60, h: 20, c: [50, 50, 50] },
            { id: "shelf", name: "Estante", price: 1500, w: 80, h: 30, c: [139, 69, 19] },
            { id: "bookcase", name: "Biblioteca", price: 3000, w: 80, h: 40, c: [101, 67, 33] },
            { id: "kitchen", name: "Cocina", price: 8000, w: 100, h: 60, c: [220, 220, 220] },
            { id: "nightstand", name: "Mesa de Noche", price: 1000, w: 30, h: 30, c: [160, 82, 45] },
            { id: "rug", name: "Alfombra", price: 2500, w: 120, h: 80, c: [200, 50, 50] },
            { id: "fireplace", name: "Chimenea", price: 6000, w: 80, h: 40, c: [178, 34, 34] },
            { id: "chest", name: "Cofre", price: 4000, w: 40, h: 40, c: [218, 165, 32] },
            { id: "mortar", name: "Mortero Botánico", price: 2000, w: 40, h: 40, c: [100, 100, 100] }
        ];


        let skillsUI = null;
        let anvilUI = null;
        let carpentryUI = null;
        let bpUI = null;
        let activeSwap = null;
        let uiMoney = null;
        let uiTime = null;
        let hotbarSlots = [];
        let uiQuest = null;
        let mortarUI = null;
        
        function getQuestText() {
            if (currentQuest === 0) return "Misión: Habla con el Asistente (cerca de tu casa)";
            if (currentQuest === 1) return "Misión: Alcanza Botánica Nvl 20";
            if (currentQuest === 2) return "Misión: Fabrica la Cura en un Mortero Botánico";
            if (currentQuest === 3) return "Misión: Entrega la Cura al Asistente";
            if (currentQuest === 4) return "Misión: Alcanza Minería Nvl 20 y el resto Nvl 10";
            if (currentQuest === 5) return "Misión: Habla con el Asistente. Estás listo.";
            return "Misión: Sobrevive";
        }
        
        function showDialog(pages, onComplete) {
            if (!Array.isArray(pages)) pages = [pages];
            let d = add([ rect(width()-100, 240, {radius: 10}), pos(width()/2, height()-140), anchor("center"), color(20,20,20), fixed(), z(1000), area() ]);
            let txt = d.add([ text("", {size: 18, width: width()-140}), pos(0, -80), anchor("top") ]);
            let hint = d.add([ text("Clic para avanzar", {size: 14}), pos(0, 100), anchor("center"), color(255,255,0) ]);
            
            let pageIdx = 0;
            let charIdx = 0;
            let timer = 0;
            let isTyping = true;
            
            d.onUpdate(() => {
                if (isTyping) {
                    timer += dt();
                    if (timer > 0.02) {
                        timer = 0;
                        charIdx++;
                        txt.text = pages[pageIdx].substring(0, charIdx);
                        if (charIdx >= pages[pageIdx].length) {
                            isTyping = false;
                        }
                    }
                }
            });
            
            d.onClick(() => {
                if (isTyping) {
                    isTyping = false;
                    txt.text = pages[pageIdx];
                } else {
                    pageIdx++;
                    if (pageIdx < pages.length) {
                        txt.text = "";
                        charIdx = 0;
                        isTyping = true;
                    } else {
                        destroy(d);
                        if (onComplete) onComplete();
                    }
                }
            });
        }
        
        function triggerEndGame() {
            const flood = add([ rect(width(), height()), color(0, 100, 255), opacity(0), fixed(), z(2000) ]);
            tween(0, 1, 4, (v) => flood.opacity = v);
            setTimeout(() => {
                add([ text("LA GRAN MAREA", {size: 40}), pos(width()/2, height()/2 - 40), anchor("center"), color(255,255,255), fixed(), z(2001) ]);
                add([ text("Continuará en la Parte 2...", {size: 24}), pos(width()/2, height()/2 + 40), anchor("center"), color(200,200,200), fixed(), z(2001) ]);
            }, 4000);
        }
        
        function toggleMortarUI() {
            if (mortarUI) { destroy(mortarUI); mortarUI = null; return; }
            mortarUI = add([ rect(400, 300), pos(width()/2, height()/2), anchor("center"), color(40,40,40), fixed(), area(), z(500) ]);
            mortarUI.add([ text("MORTERO BOTÁNICO", {size: 24}), pos(0, -120), anchor("center"), color(100,255,100) ]);
            
            let btn1 = mortarUI.add([ rect(360, 60, { radius: 8 }), color(70, 70, 70), pos(0, -30), anchor("center"), area() ]);
            btn1.add([ text("Cura Milagrosa\n(Req: Bot. 20, 10 Bayas, 5 Aloe, 2 Ginseng)", {size: 14, align: "center"}), anchor("center") ]);
            btn1.onClick(() => {
                if (skills.botanico.level < 20) {
                    add([ text("Falta nivel de Botánica", {size:18}), pos(width()/2, height()/2-150), anchor("center"), color(255,50,50), opacity(1), lifespan(1), fixed(), z(600) ]);
                    return;
                }
                if (countItem("baya") >= 10 && countItem("aloe") >= 5 && countItem("ginseng") >= 2) {
                    if (addItem("craft", "cura", "Cura", 1)) {
                        removeItem("baya", 10);
                        removeItem("aloe", 5);
                        removeItem("ginseng", 2);
                        addXP("botanico", 5);
                        if(currentQuest === 2) currentQuest = 3;
                        globalUpdateUI();
                        add([ text("¡Cura fabricada!", {size:18}), pos(width()/2, height()/2-150), anchor("center"), color(0,255,0), opacity(1), lifespan(1), fixed(), z(600) ]);
                    }
                } else add([ text("Faltan ingredientes", {size:18}), pos(width()/2, height()/2-150), anchor("center"), color(255,50,50), opacity(1), lifespan(1), fixed(), z(600) ]);
            });
            btn1.onUpdate(() => { btn1.color = btn1.isHovering() ? rgb(100,100,100) : rgb(70,70,70); });
            
            let closeBtn = mortarUI.add([ rect(30,30), color(255,0,0), pos(170,-130), anchor("center"), area() ]);
            closeBtn.add([ text("X", {size: 18}), anchor("center") ]);
            closeBtn.onClick(() => toggleMortarUI());
        }
        
        onClick("mortar", (m) => {
            let p = get("player")[0];
            if (!p) return;
            if (p.pos.dist(m.pos) < 60) toggleMortarUI();
            else add([ text("Acércate más", {size: 16}), pos(m.pos), color(255,50,50), opacity(1), lifespan(1) ]);
        });

        let globalUpdateUI = null;
        let globalStartPlacing = null;
        let isFishing = false;
        
        let isHighTide = false;
        let highTideTimer = 0;
        let isMapVisible = false;

        // TIENDA GLOBAL
        let inShop = false;
        let shopParent = null;

        function closeShop() {
            if (shopParent) { destroy(shopParent); shopParent = null; }
            inShop = false;
        }

        function openShop(inHouse = false) {
            if (inShop) return;
            inShop = true;

            shopParent = add([
                rect(800, 500), color(30, 30, 30),
                pos(width()/2, height()/2), anchor("center"),
                fixed(), z(300), area()
            ]);

            const descPanel = shopParent.add([
                rect(300, 450), color(20, 20, 20),
                pos(220, 0), anchor("center")
            ]);
            const descText = descPanel.add([
                text("Pasa el ratón por\nencima de un objeto\npara ver sus detalles.", { size: 18 }),
                pos(0, -100), anchor("center")
            ]);

            let currentMenuObjs = [];
            let currentShopCat = "main";
            function clearMenu() {
                currentMenuObjs.forEach(o => destroy(o));
                currentMenuObjs = [];
                descText.text = "Selecciona una\nopción...";
            }

            function addBtn(txt, yPos, desc, action) {
                let btn = shopParent.add([
                    rect(350, 45, { radius: 8 }), color(70, 70, 70),
                    pos(-150, yPos), anchor("center"), area()
                ]);
                btn.add([ text(txt, { size: 18 }), anchor("center") ]);
                btn.onClick(() => { 
                    action(); 
                    if (globalUpdateUI) globalUpdateUI(); 
                    drawMenu(currentShopCat);
                });
                
                let wasHovering = false;
                btn.onUpdate(() => {
                    let isHovering = btn.isHovering();
                    if (isHovering && !wasHovering) {
                        btn.color = rgb(100, 100, 100);
                        descText.text = desc;
                    } else if (!isHovering && wasHovering) {
                        btn.color = rgb(70, 70, 70);
                        if (descText.text === desc) descText.text = "Selecciona una\nopción...";
                    }
                    wasHovering = isHovering;
                });
                
                currentMenuObjs.push(btn);
            }

            function addTitle(txt) {
                let t = shopParent.add([ text(txt, { size: 28 }), pos(-150, -220), anchor("center"), color(255,255,100) ]);
                currentMenuObjs.push(t);
            }

            function buyFurniture(id) {
                const item = FURNITURE_CATALOG.find(f => f.id === id);
                if (money >= item.price) {
                    if (globalStartPlacing) {
                        globalStartPlacing(item);
                    }
                } else {
                    add([ text("Dinero Insuficiente", { size: 24 }), pos(width()/2, height()/2), anchor("center"), color(255,50,50), opacity(1), lifespan(1), fixed(), z(400) ]);
                }
            }

            function drawMenu(cat) {
                currentShopCat = cat;
                clearMenu();
                if (cat === "main") {
                    addTitle("--- TIENDA ---");
                    addBtn("Semillas", -120, "Catálogo de semillas.", () => drawMenu("seeds"));
                    addBtn("Comida", -60, "Comida silvestre.", () => drawMenu("food"));
                    addBtn("Abonos", 0, "Fertilizantes para\ntus cultivos.", () => drawMenu("fertilizers"));
                    addBtn("Herramientas", 60, "Equipo de trabajo.", () => drawMenu("tools"));
                    addBtn("Equipo", 120, "Mejora tu inventario\ncomprando mochilas.", () => drawMenu("equip"));
                    addBtn("Vender", 180, "Vende tus cultivos,\npeces y muebles.", () => drawMenu("sell"));
                    
                    if (inHouse) {
                        addBtn("Muebles (CASA)", 240, "¡Exclusivo de interiores!\n\nDecora tu casa con\nmuebles de lujo.", () => drawMenu("furniture1"));
                    }
                }
                else if (cat === "equip") {
                    addTitle("--- EQUIPO ---");
                    let b1 = backpackLevel >= 1 ? "Adquirido" : "Mochila Pequeña (-$2000)";
                    addBtn(b1, -140, "Desbloquea 9 espacios extras.", () => {
                        if(backpackLevel === 0 && money >= 2000) { money-=2000; backpackLevel=1; }
                    });
                    let b2 = backpackLevel >= 2 ? "Adquirido" : (backpackLevel<1?"Bloqueado":"Mochila Mediana (-$5000)");
                    addBtn(b2, -80, "18 espacios extras en total.", () => {
                        if(backpackLevel === 1 && money >= 5000) { money-=5000; backpackLevel=2; }
                    });
                    let b3 = backpackLevel >= 3 ? "Adquirido" : (backpackLevel<2?"Bloqueado":"Mochila Grande (-$12000)");
                    addBtn(b3, -20, "27 espacios extras en total.", () => {
                        if(backpackLevel === 2 && money >= 12000) { money-=12000; backpackLevel=3; }
                    });
                    addBtn("<< Volver", 100, "Regresar al menú principal.", () => drawMenu("main"));
                }
                else if (cat === "seeds") {
                    addTitle("--- SEMILLAS ---");
                    addBtn("Tomate (-$3)", -140, "Requiere Tierra.\nVende a $6.", () => {
                        if (money >= 3 && addItem("seed", "seed_tomato", "Tomate", 1)) money -= 3;
                    });
                    addBtn("Cactus (-$5)", -80, "Requiere Arena.\nVende a $12.", () => {
                        if (money >= 5 && addItem("seed", "seed_cactus", "Cactus", 1)) money -= 5;
                    });
                    addBtn("S. Baya (-$2)", -20, "Requiere Tierra.\nVende a $4.", () => {
                        if (money >= 2 && addItem("seed", "seed_baya", "S. Baya", 1)) money -= 2;
                    });
                    addBtn("Mágica (-$24)", 40, "Requiere Abono Especial.\nVende a $60.", () => {
                        if (money >= 24 && addItem("seed", "seed_magic", "Mágica", 1)) money -= 24;
                    });
                    addBtn("<< Volver", 100, "Regresar al menú.", () => drawMenu("main"));
                }
                else if (cat === "food") {
                    addTitle("--- COMIDA ---");
                    addBtn("Baya (-$5)", -140, "Restaura 20 Energía.\nAlimento silvestre.", () => {
                        if (money >= 5 && addItem("food", "baya", "Baya", 1)) money -= 5;
                    });
                    addBtn("<< Volver", 100, "Regresar al menú.", () => drawMenu("main"));
                }
                else if (cat === "fertilizers") {
                    addTitle("--- ABONOS ---");
                    addBtn("Normal (-$6)", -140, "Madura al instante.", () => {
                        if (money >= 6 && addItem("fertilizer", "fert_normal", "Abono N", 1)) money -= 6;
                    });
                    addBtn("Especial (-$18)", -80, "Para Semillas Mágicas.", () => {
                        if (money >= 18 && addItem("fertilizer", "fert_special", "Abono Esp", 1)) money -= 18;
                    });
                    addBtn("<< Volver", 100, "Regresar al menú.", () => drawMenu("main"));
                }
                else if (cat === "tools") {
                    addTitle("--- HERRAMIENTAS ---");
                    addBtn("Tijeras (-$18)", -140, "Para talar árboles.", () => {
                        if (money >= 18 && addItem("tool", "scissors", "Tijeras", 30)) money -= 18;
                    });
                    let rodTxt = skills.pescador.level >= 20 ? "Caña de Pescar (-$10000)" : "Caña (Nvl Pescador 20)";
                    addBtn(rodTxt, -80, "Nivel 20 requerido.", () => {
                        if (skills.pescador.level >= 20 && money >= 10000 && countItem("rod")===0) {
                            if(addItem("tool", "rod", "Caña", 1)) money -= 10000;
                        }
                    });
                    addBtn("<< Volver", 100, "Regresar al menú.", () => drawMenu("main"));
                }
                else if (cat === "sell") {
                    addTitle("--- VENDER (1/2) ---");
                    addBtn(`Vender Tomate (+$6)`, -140, `Tienes: ${countItem("crop_tomato")}`, () => {
                        if (countItem("crop_tomato") >= 1) { removeItem("crop_tomato", 1); money += 6; }
                    });
                    addBtn(`Vender Cactus (+$12)`, -80, `Tienes: ${countItem("crop_cactus")}`, () => {
                        if (countItem("crop_cactus") >= 1) { removeItem("crop_cactus", 1); money += 12; addXP("botanico", 2); }
                    });
                    addBtn(`Vender F. Mágico (+$60)`, -20, `Tienes: ${countItem("crop_magic")}`, () => {
                        if (countItem("crop_magic") >= 1) { removeItem("crop_magic", 1); money += 60; }
                    });
                    addBtn(`Vender Baya (+$4)`, 40, `Tienes: ${countItem("baya")}`, () => {
                        if (countItem("baya") >= 1) { removeItem("baya", 1); money += 4; }
                    });
                    addBtn("Siguiente >>", 100, "Ver más opciones de venta.", () => drawMenu("sell2"));
                    addBtn("<< Volver", 160, "Regresar al menú.", () => drawMenu("main"));
                }
                else if (cat === "sell2") {
                    addTitle("--- VENDER (2/2) ---");
                    addBtn(`Silla Madera (+$50)`, -140, `Tienes: ${countItem("chair_wood")}`, () => {
                        if (removeItem("chair_wood", 1)) money += 50;
                    });
                    addBtn(`Mesa Madera (+$100)`, -80, `Tienes: ${countItem("table_wood")}`, () => {
                        if (removeItem("table_wood", 1)) money += 100;
                    });
                    addBtn(`Vender Pez (+$30)`, -20, `Tienes: ${countItem("fish")}`, () => {
                        if (removeItem("fish", 1)) money += 30;
                    });
                    addBtn("<< Volver", 160, "Página anterior.", () => drawMenu("sell"));
                }

                else if (cat === "furniture1") {
                    addTitle("--- MUEBLES (1/2) ---");
                    addBtn("Sofá (-$2000)", -140, "Un sofá cómodo.\nPresiona ESPACIO\npara colocarlo o\nESC para cancelar.", () => buyFurniture("sofa"));
                    addBtn("Televisor (-$5000)", -80, "Para ver noticias.\nPresiona ESPACIO\npara colocarlo o\nESC para cancelar.", () => buyFurniture("tv"));
                    addBtn("Estante (-$1500)", -20, "Madera fina.\nPresiona ESPACIO\npara colocarlo o\nESC para cancelar.", () => buyFurniture("shelf"));
                    addBtn("Biblioteca (-$3000)", 40, "Llena de libros.\nPresiona ESPACIO\npara colocarlo o\nESC para cancelar.", () => buyFurniture("bookcase"));
                    addBtn("Pág Siguiente >>", 100, "Ver más muebles.", () => drawMenu("furniture2"));
                    addBtn("<< Volver", 160, "Regresar al menú.", () => drawMenu("main"));
                }
                else if (cat === "furniture2") {
                    addTitle("--- MUEBLES (2/2) ---");
                    addBtn("Cocina (-$8000)", -140, "Prepara comida.\nPresiona ESPACIO\npara colocarlo o\nESC para cancelar.", () => buyFurniture("kitchen"));
                    addBtn("Mesa Noche (-$1000)", -80, "Junto a la cama.\nPresiona ESPACIO\npara colocarlo o\nESC para cancelar.", () => buyFurniture("nightstand"));
                    addBtn("Alfombra (-$2500)", -20, "No bloquea el paso.\nPresiona ESPACIO\npara colocarlo o\nESC para cancelar.", () => buyFurniture("rug"));
                    addBtn("Chimenea (-$6000)", 40, "Calienta la casa.\nPresiona ESPACIO\npara colocarlo o\nESC para cancelar.", () => buyFurniture("fireplace"));
                    addBtn("Cofre (-$4000)", 100, "Guarda tus objetos\nvaliosos aquí.\n(Evita robos al\ndesmayarte)", () => buyFurniture("chest"));
                    addBtn("<< Volver", 160, "Página anterior.", () => drawMenu("furniture1"));
                }
            }

            drawMenu("main");

            let closeBtn = shopParent.add([
                rect(350, 45, { radius: 8 }), color(150, 50, 50),
                pos(-150, 220), anchor("center"), area()
            ]);
            closeBtn.add([ text("Cerrar Tienda (T)", { size: 18 }), anchor("center") ]);
            closeBtn.onClick(() => closeShop());
            closeBtn.onUpdate(() => {
                closeBtn.color = closeBtn.isHovering() ? rgb(200, 50, 50) : rgb(150, 50, 50);
            });
        }


        function makeAssistant(x, y) {
            const p = add([
                rect(24, 24), color(205, 133, 63),
                pos(x, y), area({ shape: new Rect(vec2(0, 30), 40, 70) }), body({isStatic:true}), anchor("center"), z(50), "assistant"
            ]);
            p.add([ rect(30, 40), color(34, 139, 34), pos(0, 32), anchor("center") ]);
            p.add([ rect(10, 30), color(205, 133, 63), pos(-20, 20), anchor("center") ]);
            p.add([ rect(10, 30), color(205, 133, 63), pos(20, 20), anchor("center") ]);
            p.add([ rect(12, 30), color(139, 69, 19), pos(-10, 60), anchor("center") ]);
            p.add([ rect(12, 30), color(139, 69, 19), pos(10, 60), anchor("center") ]);
            return p;
        }

        function saveGame() {
            const data = { money, energy, dayTime, isNight, dayCount, boatRepaired, currentQuest, skills, backpack, hotbar, globalStorage };
            localStorage.setItem("farmGameSave", JSON.stringify(data));
        }

        function loadGame() {
            const saved = localStorage.getItem("farmGameSave");
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    money = data.money !== undefined ? data.money : money;
                    energy = data.energy !== undefined ? data.energy : energy;
                    dayTime = data.dayTime !== undefined ? data.dayTime : dayTime;
                    isNight = data.isNight !== undefined ? data.isNight : isNight;
                    dayCount = data.dayCount || dayCount;
                    boatRepaired = data.boatRepaired !== undefined ? data.boatRepaired : boatRepaired;
                    currentQuest = data.currentQuest !== undefined ? data.currentQuest : currentQuest;
                    if (data.skills) skills = data.skills;
                    if (data.backpack) backpack = data.backpack;
                    if (data.hotbar) hotbar = data.hotbar;
                    if (data.globalStorage) globalStorage = data.globalStorage;
                } catch(e) {}
            }
        }

        setInterval(saveGame, 5000);

        function handlePlayerAnim(plyr, canMove) {
            if (!canMove) {
                plyr.legL.pos.y = 10;
                plyr.legR.pos.y = 10;
                return;
            }
            let moved = false;
            if (isKeyDown("a") || isKeyDown("left")) { 
                plyr.scale.x = -1.2; 
                moved = true; 
                plyr.viewDown.hidden = true; plyr.viewUp.hidden = true; plyr.viewSide.hidden = false;
            } else if (isKeyDown("d") || isKeyDown("right")) { 
                plyr.scale.x = 1.2; 
                moved = true; 
                plyr.viewDown.hidden = true; plyr.viewUp.hidden = true; plyr.viewSide.hidden = false;
            } else if (isKeyDown("w") || isKeyDown("up")) { 
                moved = true; 
                plyr.viewDown.hidden = true; plyr.viewUp.hidden = false; plyr.viewSide.hidden = true;
            } else if (isKeyDown("s") || isKeyDown("down")) { 
                moved = true; 
                plyr.viewDown.hidden = false; plyr.viewUp.hidden = true; plyr.viewSide.hidden = true;
            }

            if (moved) {
                plyr.walkTimer += dt() * 15;
                plyr.legL.pos.y = 10 + Math.sin(plyr.walkTimer) * 3;
                plyr.legR.pos.y = 10 + Math.sin(plyr.walkTimer + Math.PI) * 3;
            } else {
                plyr.legL.pos.y = 10;
                plyr.legR.pos.y = 10;
                plyr.walkTimer = 0;
            }
        }

        function checkPassOut() {
            if (energy <= 0) {

                for(let i=0; i<9; i++) if(hotbar[i] && hotbar[i].cat !== "tool") hotbar[i].q = Math.floor(hotbar[i].q / 2);
                for(let i=0; i<27; i++) if(backpack[i] && backpack[i].cat !== "tool") backpack[i].q = Math.floor(backpack[i].q / 2);
                dayTime = 0; 
                isNight = false;
                energy = MAX_ENERGY; 
                go("house", { passedOut: true });
            }
        }

                            rect(40, 40), sColor,

                else if (item && item.id === "water") {

                            globalUpdateUI(); checkPassOut();

                    }
                }
                else if (item && item.cat === "seed") {
                    if (item.q > 0 && energy >= 2) {
                        const emptySoils = get("soil").filter(s => s.pos.dist(actPos) < 20 && !s.hasPlant);
                        if (emptySoils.length > 0) {
                            let soil = emptySoils[0];
                            
                            let reqSoil = item.id === "seed_tomato" ? "normal" : item.id === "seed_cactus" ? "sand" : "normal";

                            }

                            energy -= 2;
                            soil.hasPlant = true;
                            addXP("jardinero", 1);
                            
                            if (item.id === "seed_magic") soil.use(color(218, 112, 214)); 
                            else soil.use(item.id === "seed_tomato" ? color(160, 82, 45) : item.id === "seed_baya" ? color(154, 205, 50) : color(230, 200, 160));

                            item.q--;

                            globalUpdateUI(); checkPassOut();

                            let cColor = item.id === "seed_tomato" ? color(144, 238, 144) : item.id === "seed_cactus" ? color(46, 139, 87) : item.id === "seed_baya" ? color(154, 205, 50) : color(218, 112, 214);
                            let gTime = item.id === "seed_tomato" ? 15 : item.id === "seed_cactus" ? 30 : item.id === "seed_baya" ? 20 : 45;

                            const crop = add([
                                rect(16, 16), cColor,
                                pos(soil.pos), anchor("center"), area(),
                                z(20), "crop", { stage: "seed", timer: 0, seedType: item.id, growTime: gTime }
                            ]);

                            crop.onUpdate(() => {
                                if (!soil.isWatered) return; 

                                if (crop.stage === "seed") {
                                    crop.timer += dt();
                                    if (crop.timer > (crop.growTime / 2)) {
                                        crop.stage = "growing";
                                        crop.color = crop.seedType === "seed_tomato" ? rgb(50, 205, 50) : crop.seedType === "seed_cactus" ? rgb(34, 139, 34) : crop.seedType === "seed_baya" ? rgb(107, 142, 35) : rgb(138, 43, 226);
                                        crop.width = 24; crop.height = 24;
                                    }
                                }
                                else if (crop.stage === "growing") {
                                    crop.timer += dt();
                                    if (crop.timer >= crop.growTime) {
                                        crop.stage = "ready";
                                        crop.color = crop.seedType === "seed_tomato" ? rgb(255, 69, 0) : crop.seedType === "seed_cactus" ? rgb(255, 105, 180) : crop.seedType === "seed_baya" ? rgb(220, 20, 60) : rgb(255, 215, 0); 
                                        crop.width = 30; crop.height = 30;
                                    }
                                }
                            });
                        }
                    }
                }
                else if (item && item.cat === "fertilizer") {
                    const soils = get("soil").filter(s => s.pos.dist(actPos) < 20);
                    if (soils.length > 0) {
                        let soil = soils[0];
                        if (item.id === "fert_normal" && item.q > 0) {
                            if (soil.hasPlant) {
                                let crop = get("crop").filter(c => c.pos.dist(soil.pos) < 5 && c.stage !== "ready")[0];
                                if (crop) {
                                    crop.timer = crop.growTime; 
                                    item.q--; if(item.q<=0) hotbar[activeTool]=null;
                                    globalUpdateUI();
                                }
                            }
                        } else if (item.id === "fert_special" && item.q > 0) {
                            if (!soil.hasSpecialFertilizer && !soil.hasPlant) {
                                soil.hasSpecialFertilizer = true;
                                item.q--; if(item.q<=0) hotbar[activeTool]=null;
                                soil.use(color(148, 0, 211)); 
                                add([ text("Tierra Mágica", {size: 14}), pos(actPos.x, actPos.y-20), color(255,0,255), opacity(1), lifespan(1) ]);
                                globalUpdateUI();
                            }

                    }
                }
                else if (item && item.id === "scissors") {
                    if (item.q > 0) {
                        const trees = get("tree").filter(t => t.pos.dist(actPos) < 40);
                        if (trees.length > 0 && energy >= 2) {
                            destroy(trees[0]);

                            money += 12; addXP("botanico", 2);
                            add([ text("+$12 (Poda)", {size:16}), pos(actPos.x, actPos.y-20), color(255,255,0), opacity(1), lifespan(1) ]);

                        }
                    }
                }
                else if (item && item.id === "rod") {

                                    add([ text("Nada...", {size:18}), pos(player.pos.x, player.pos.y-30), color(150,150,150), opacity(1), lifespan(2) ]);

                            add([ text("Acércate al lago", {size:14}), pos(player.pos.x, player.pos.y-30), color(255,100,100), opacity(1), lifespan(1) ]);

                else if (item && item.cat === "food") {

                    let regen = 20;
                    energy = Math.min(MAX_ENERGY, energy + regen);
                    add([ text(`+${regen} Energía`, {size:16}), pos(player.pos.x, player.pos.y-30), color(0,255,0), opacity(1), lifespan(1) ]);

                const readyCrops = get("crop").filter(c => c.pos.dist(actPos) < 20 && c.stage === "ready");

                        soil.use(soil.soilType === "normal" ? color(139, 69, 19) : color(210, 180, 140));

                    let crName = sType === "seed_tomato" ? "T.Cosech" : sType === "seed_cactus" ? "C.Cosech" : sType === "seed_baya" ? "Baya" : "F.Mágico";
                    let crId = sType === "seed_baya" ? "baya" : "crop_" + sType.split("_")[1];
                    let crCat = sType === "seed_baya" ? "food" : "crop";
                    addItem(crCat, crId, crName, 1);
                    
                    addXP("agricultor", 1); addXP("botanico", 1);
                    addXP("botanico", 1);
                    globalUpdateUI();
                }
            });

            onClick("wood_log", (l) => {
                let item = hotbar[activeTool];
                if (item && item.id.startsWith("axe_") && l.pos.dist(player.pos) < 60) {
                    if (energy >= 2) {
                        if(!l.hp) l.hp = 4;
                        l.hp -= getToolDamage(item.id);

                                add([ text("+1 Madera", {size:16}), pos(l.pos.x, l.pos.y-20), color(160, 82, 45), opacity(1), lifespan(1) ]);
                                if (Math.random() < 0.20) {
                                    if (addItem("food", "chontaduro", "Chontaduro", 1)) {
                                        add([ text("+1 Chontaduro", {size:16}), pos(l.pos.x, l.pos.y-40), color(255, 100, 100), opacity(1), lifespan(1) ]);
                                    }
                                }
                            } else {
                                add([ text("Inventario Lleno", {size:16}), pos(l.pos.x, l.pos.y-20), color(255, 50, 50), opacity(1), lifespan(1) ]);
                            }

                    }
                }
            });

            onClick("rock", (r) => {
                let item = hotbar[activeTool];
                if (item && item.id.startsWith("pickaxe_") && r.pos.dist(player.pos) < 60) {
                    if (energy >= 3) {
                        if(!r.hp) r.hp = 4;
                        r.hp -= getToolDamage(item.id);

                        add([ text("-" + getToolDamage(item.id), {size:16}), pos(r.pos.x, r.pos.y-20), color(255, 0, 0), opacity(1), lifespan(0.5) ]);

                            else if(rnd < 0.60) { dropId = "copper"; dropName = "Cobre"; dropColor = rgb(205,127,50); }
                            
                            if (addItem("material", dropId, dropName, 1)) {

                                add([ text("Inventario Lleno", {size:16}), pos(r.pos.x, r.pos.y-20), color(255, 50, 50), opacity(1), lifespan(1) ]);

                    }
                }
            });

            onClick("aloe", (a) => {
                if (player.pos.dist(a.pos) < 80) {
                    if (energy < 2) { add([ text("Muy cansado", {size:16}), pos(a.pos.x, a.pos.y-20), color(255,0,0), lifespan(1) ]); return; }
                    if (addItem("material", "aloe", "Aloe Vera", 1)) {
                        destroy(a); energy -= 2; addXP("botanico", 3); money += 2;
                        add([ text("+1 Aloe", {size:16}), pos(a.pos.x, a.pos.y-20), color(0,255,0), lifespan(1) ]);
                        globalUpdateUI(); checkPassOut();
                    } else add([ text("Inv Lleno", {size:16}), pos(a.pos.x, a.pos.y-20), color(255,0,0), lifespan(1) ]);
                }
            });
            onClick("ginseng", (g) => {
                if (player.pos.dist(g.pos) < 80) {
                    if (energy < 2) { add([ text("Muy cansado", {size:16}), pos(g.pos.x, g.pos.y-20), color(255,0,0), lifespan(1) ]); return; }
                    if (addItem("material", "ginseng", "Ginseng", 1)) {
                        destroy(g); energy -= 2; addXP("botanico", 4); money += 4;
                        add([ text("+1 Ginseng", {size:16}), pos(g.pos.x, g.pos.y-20), color(210,180,140), lifespan(1) ]);

                    } else add([ text("Inv Lleno", {size:16}), pos(g.pos.x, g.pos.y-20), color(255,0,0), lifespan(1) ]);
                }
            });
            onClick("bush", (b) => {
                let item = hotbar[activeTool];
                if (item && item.id.startsWith("axe_") && b.pos.dist(player.pos) < 60) {
                    if (energy >= 1) {
                        destroy(b);
                        energy -= 1;
                        add([ text("-1", {size:16}), pos(b.pos.x, b.pos.y-20), color(255, 0, 0), opacity(1), lifespan(0.5) ]);
                        if (addItem("food", "baya", "Baya", 2)) {
                            add([ text("+2 Bayas", {size:16}), pos(b.pos.x, b.pos.y-20), color(255, 100, 100), opacity(1), lifespan(1) ]);
                            if (Math.random() < 0.5) {

                                    add([ text("+1 S. Baya", {size:16}), pos(b.pos.x, b.pos.y-40), color(154, 205, 50), opacity(1), lifespan(1) ]);

                        globalUpdateUI(); checkPassOut();
                    }
                }
            });

            globalUpdateUI();
        });

        scene("house", (args) => {
            addGlobalUI("house");
            add([ rect(width(), height()), color(139, 69, 19) ]);

            // MUEBLES YA COLOCADOS
            placedFurniture.forEach(f => {
                add([
                    rect(f.w, f.h), color(f.c[0], f.c[1], f.c[2]),
                    pos(f.x, f.y), anchor("center"), rotate(f.rot),
                    area(),
                    f.isRug ? z(5) : body({ isStatic: true }),
                    f.isRug ? "rug" : "solid_house",
                    f.isChest ? "chest" : "furniture"
                ]);
            });

            const bed = add([
                rect(100, 140), color(178, 34, 34),
                pos(width()/2, height()/2 - 60), area(), 
                anchor("center"), "solid_house" // No collision body so player can walk on it, but furniture preview spots it
            ]);
            add([
                rect(80, 30), color(255, 255, 255),
                pos(width()/2, height()/2 - 110),
                anchor("center")
            ]);
            add([ text("CAMA", { size: 20 }), pos(width()/2, height()/2 - 60), anchor("center"), color(255,255,255) ]);

            add([
                rect(120, 40), color(0, 0, 0),
                pos(width()/2, height() - 20), area(), anchor("center"), "exit_door"
            ]);
            add([ text("SALIR", { size: 20 }), pos(width()/2, height() - 20), anchor("center"), color(255,255,255) ]);

            const p = makePlayer(width()/2, height() - 80, true);

            const SPEED = 200;
            let isSleeping = false;
            
            // VARIABLES COFRE
            let inChest = false;
            let chestParent = null;

            function closeChest() {
                if (chestParent) { destroy(chestParent); chestParent = null; }
                inChest = false;
            }

            function openChest() {
                if (inChest) return;
                inChest = true;

                chestParent = add([
                    rect(600, 400), color(40, 20, 10),
                    pos(width()/2, height()/2), anchor("center"),
                    fixed(), z(300), area()
                ]);

                chestParent.add([ text("--- BÓVEDA DEL COFRE ---", { size: 28 }), pos(0, -160), anchor("center"), color(255,215,0) ]);
                chestParent.add([ text("Almacenamiento seguro.\nLos objetos aquí NO se perderán si te desmayas.", { size: 16, align: "center" }), pos(0, -110), anchor("center"), color(200,200,200) ]);

                let btn1 = chestParent.add([ rect(450, 50, {radius:8}), color(100,50,20), pos(0, -30), anchor("center"), area() ]);
                btn1.add([ text("Depositar Todo al Cofre", {size:16}), anchor("center") ]);
                btn1.onClick(() => {
                    for(let i=0; i<9; i++) {
                        if(hotbar[i] && hotbar[i].cat !== "tool") {
                            let empty = getEmptySlot(globalStorage, 27);
                            if (empty !== -1) { globalStorage[empty] = hotbar[i]; hotbar[i] = null; }
                        }
                    }
                    for(let i=0; i<27; i++) {
                        if(backpack[i] && backpack[i].cat !== "tool") {
                            let empty = getEmptySlot(globalStorage, 27);
                            if (empty !== -1) { globalStorage[empty] = backpack[i]; backpack[i] = null; }
                        }
                    }
                    add([ text("¡Depositado al máximo de capacidad!", {size:20}), pos(width()/2, height()/2), anchor("center"), color(0,255,0), opacity(1), lifespan(1), z(400) ]);
                    if(globalUpdateUI) globalUpdateUI();
                });

                let btn2 = chestParent.add([ rect(450, 50, {radius:8}), color(100,50,20), pos(0, 50), anchor("center"), area() ]);
                btn2.add([ text("Retirar Todo a mi Inventario", {size:18}), anchor("center") ]);
                btn2.onClick(() => {
                    for(let i=0; i<27; i++) {
                        if(globalStorage[i]) {
                            if (addItem(globalStorage[i].cat, globalStorage[i].id, globalStorage[i].name, globalStorage[i].q)) {
                                globalStorage[i] = null;
                            }
                        }
                    }
                    add([ text("¡Retirado al máximo de capacidad!", {size:20}), pos(width()/2, height()/2), anchor("center"), color(0,255,0), opacity(1), lifespan(1), z(400) ]);

                });

                let closeBtn = chestParent.add([

                    pos(0, 150), anchor("center"), area()
                ]);
                closeBtn.add([ text("Cerrar Cofre (ESC)", { size: 18 }), anchor("center") ]);
                closeBtn.onClick(() => closeChest());
            }

            // VARIABLES COLOCACIÓN DE MUEBLES
            let placingFurniture = null;
            let previewEntity = null;

            globalStartPlacing = (item) => {
                closeShop();
                placingFurniture = item;
                previewEntity = add([
                    rect(item.w, item.h),
                    color(item.c[0], item.c[1], item.c[2]),
                    pos(mousePos()),
                    anchor("center"),
                    rotate(0),
                    opacity(0.7),
                    z(150),
                    "preview"
                ]);
            };

            onKeyDown("left", () => { if(!isSleeping && !inShop && !inChest) p.move(-SPEED, 0) });
            onKeyDown("right", () => { if(!isSleeping && !inShop && !inChest) p.move(SPEED, 0) });
            onKeyDown("up", () => { if(!isSleeping && !inShop && !inChest) p.move(0, -SPEED) });
            onKeyDown("down", () => { if(!isSleeping && !inShop && !inChest) p.move(0, SPEED) });
            onKeyDown("a", () => { if(!isSleeping && !inShop && !inChest) p.move(-SPEED, 0) });
            onKeyDown("d", () => { if(!isSleeping && !inShop && !inChest) p.move(SPEED, 0) });
            onKeyDown("w", () => { if(!isSleeping && !inShop && !inChest) p.move(0, -SPEED) });
            onKeyDown("s", () => { if(!isSleeping && !inShop && !inChest) p.move(0, SPEED) });

            p.onUpdate(() => {
                if (p.pos.x < 16) p.pos.x = 16;
                if (p.pos.x > width() - 16) p.pos.x = width() - 16;
                if (p.pos.y < 16) p.pos.y = 16;
                if (p.pos.y > height() - 16) p.pos.y = height() - 16;
                handlePlayerAnim(p, !isSleeping && !inShop && !inChest);
            });

            onUpdate(() => {
                if (placingFurniture && previewEntity) {
                    previewEntity.pos = mousePos();
                    
                    let overlapping = false;
                    const solids = get("solid_house");
                    for (let s of solids) {
                        if (previewEntity.isColliding(s)) {
                            overlapping = true; break;
                        }
                    }
                    
                    if (previewEntity.pos.x < 50 || previewEntity.pos.x > width() - 50 || 
                        previewEntity.pos.y < 50 || previewEntity.pos.y > height() - 50) {
                        overlapping = true; // Choca con la pared
                    }

                    previewEntity.color = overlapping ? rgb(255, 0, 0) : rgb(placingFurniture.c[0], placingFurniture.c[1], placingFurniture.c[2]);
                    previewEntity.overlapping = overlapping;
                }
            });

            p.onCollide("exit_door", () => { if(!isSleeping && !placingFurniture && !inShop && !inChest) go("game") });

            

            const darkness = add([
                rect(width(), height()), color(0, 0, 50),
                opacity(isNight ? 0.2 : 0), fixed(), z(190)
            ]);

            onUpdate(() => {
                if (isSleeping) return; 
                dayTime += dt();
                if (dayTime > 300) dayTime = 0;
                isNight = dayTime > 150;
                
                if (isNight) {
                    darkness.opacity = Math.min(0.2, darkness.opacity + dt() * 0.1);
                    exhaustTimer += dt();
                    if (exhaustTimer >= 3) {
                        exhaustTimer = 0; energy -= 1; globalUpdateUI(); checkPassOut();
                    }
                } else {
                    darkness.opacity = Math.max(0, darkness.opacity - dt() * 0.1);
                    exhaustTimer = 0;
                }
            });

            if (args?.passedOut) {
                add([
                    text("¡Te desmayaste de cansancio!\nAlguien te robó la mitad\nde las cosas de tu inventario.", { size: 24, align: "center" }),
                    pos(width()/2, height()/2 + 80), anchor("center"),
                    color(255, 100, 100), opacity(1), lifespan(6, { fade: 1 }), z(200)
                ]);
            }

                if (floor < 3) {
                    const nextSign = add([
                        rect(80, 40), color(139, 69, 19),

                    ]);

                }

                    rect(24, 24), color(255, 204, 153),
                    pos(width() / 2, floor === 1 ? 80 : 80), 
                    area(), body(), anchor("center"), z(50), "player"
                ]);
                player = p;

                let numRocks = 40 + floor * 20;
                for (let i = 0; i < numRocks; i++) {
                    let tx = rand(50, width() - 50);
                    let ty = rand(100, height() - 100);
                    
                    if (Math.abs(tx - width()/2) < 80 && ty < 120) continue; 
                    if (floor < 3 && Math.abs(tx - width()/2) < 80 && ty > height() - 120) continue; 

                    let size = rand(15, 35);
                    let gray = rand(60, 160);
                    add([
                        rect(size, size, { radius: 5 }), color(gray, gray, gray),
                        pos(tx, ty), area(), body({ isStatic: true }), anchor("center"), z(15), "mine_rock", { hp: Math.floor(size / 5) }
                    ]);

                onClick("mine_rock", (r) => {
                    let item = hotbar[activeTool];

                            r.hp -= getToolDamage(item.id);

                            add([ text("-" + getToolDamage(item.id), {size:16}), pos(r.pos.x, r.pos.y-20), color(255, 0, 0), opacity(1), lifespan(0.5) ]);
                            if(r.hp <= 0) {
                                destroy(r);
                                let dropId = "stone"; let dropName = "Piedra"; let dropColor = rgb(100,100,100);
                                let rnd = Math.random();
                                
                                let depthBonus = floor * 0.05;
                                
                                if(rnd < 0.01 + depthBonus*0.2) { dropId = "iridium"; dropName = "Iridio"; dropColor = rgb(128,0,128); }
                                else if(rnd < 0.03 + depthBonus*0.3) { dropId = "fossil"; dropName = "Fósil"; dropColor = rgb(210,180,140); }
                                else if(rnd < 0.06 + depthBonus*0.4) { dropId = "ruby"; dropName = "Rubí"; dropColor = rgb(255,0,0); }
                                else if(rnd < 0.10 + depthBonus*0.5) { dropId = "emerald"; dropName = "Esmeralda"; dropColor = rgb(0,255,0); }
                                else if(rnd < 0.15 + depthBonus*0.6) { dropId = "geode"; dropName = "Geoda"; dropColor = rgb(139,69,19); }
                                else if(rnd < 0.20 + depthBonus) { dropId = "diamond"; dropName = "Diamante"; dropColor = rgb(0,255,255); }
                                else if(rnd < 0.40 + depthBonus) { dropId = "gold"; dropName = "Oro"; dropColor = rgb(255,215,0); }
                                else if(rnd < 0.60 + depthBonus) { dropId = "iron"; dropName = "Hierro"; dropColor = rgb(200,200,200); }
                                else if(rnd < 0.80 + depthBonus) { dropId = "copper"; dropName = "Cobre"; dropColor = rgb(205,127,50); }
                                
                                if (addItem("material", dropId, dropName, 1)) {
                                    add([ text("+1 " + dropName, {size:16}), pos(r.pos.x, r.pos.y-20), color(dropColor), opacity(1), lifespan(1) ]);

                        if (exhaustTimer >= 3) {
                            exhaustTimer = 0; energy -= 1;
                            if (globalUpdateUI) globalUpdateUI(); 
                            checkPassOut();
                        }
                    }
                });
                
                if (globalUpdateUI) globalUpdateUI();
            };
        }

                add([ rect(80, 80), color(139, 69, 19), pos(rand(100, width()-100), rand(100, height()-200)), area(), body({isStatic:true}), anchor("center") ]);
            }
            if (globalUpdateUI) globalUpdateUI();
        });

        scene("city", () => {
            addGlobalUI("city");
            add([ rect(width(), height()), color(169, 169, 169), z(0) ]);
            add([ text("Civilización", {size: 30}), pos(width()/2, 40), anchor("center"), color(0,0,0) ]);
            
            const b = add([
                rect(100, 40), color(139, 69, 19),
                pos(width()/2, height() - 50), anchor("center"), area(), "return_boat"
            ]);
            b.add([ text("Volver", {size:16}), anchor("center") ]);

            const p = add([
                rect(24, 24), color(255, 204, 153),
                pos(width() / 2, height() - 120), area(), body(), anchor("center"), z(50), "player"
            ]);
            
            onClick("return_boat", () => { go("game"); });
            p.onCollide("return_boat", () => { go("game"); });

            const SPEED = 200;
            onKeyDown("left", () => p.move(-SPEED, 0));
            onKeyDown("right", () => p.move(SPEED, 0));
            onKeyDown("up", () => p.move(0, -SPEED));
            onKeyDown("down", () => p.move(0, SPEED));
            onKeyDown("a", () => p.move(-SPEED, 0));
            onKeyDown("d", () => p.move(SPEED, 0));
            onKeyDown("w", () => p.move(0, -SPEED));
            onKeyDown("s", () => p.move(0, SPEED));
            
            for(let i=0; i<4; i++) {
                add([ rect(120, 150), color(100, 100, 120), pos(rand(100, width()-100), rand(100, height()-200)), area(), body({isStatic:true}), anchor("center") ]);
            }
            if (globalUpdateUI) globalUpdateUI();
        });

        scene("deep_jungle", () => {
            addGlobalUI("deep_jungle");
            add([ rect(width(), height()), color(0, 50, 0), z(0) ]);
            add([ text("Selva Profunda", {size: 30}), pos(width()/2, 40), anchor("center"), color(255,255,255) ]);
            
            const b = add([
                rect(100, 40), color(139, 69, 19),
                pos(width()/2, height() - 50), anchor("center"), area(), "return_boat"
            ]);
            b.add([ text("Volver", {size:16}), anchor("center") ]);

            const p = add([
                rect(24, 24), color(255, 204, 153),
                pos(width() / 2, height() - 120), area(), body(), anchor("center"), z(50), "player"
            ]);
            
            onClick("return_boat", () => { go("game"); });
            p.onCollide("return_boat", () => { go("game"); });

            const SPEED = 200;
            onKeyDown("left", () => p.move(-SPEED, 0));
            onKeyDown("right", () => p.move(SPEED, 0));
            onKeyDown("up", () => p.move(0, -SPEED));
            onKeyDown("down", () => p.move(0, SPEED));
            onKeyDown("a", () => p.move(-SPEED, 0));
            onKeyDown("d", () => p.move(SPEED, 0));
            onKeyDown("w", () => p.move(0, -SPEED));
            onKeyDown("s", () => p.move(0, SPEED));
            
            for(let i=0; i<30; i++) {
                let tx = rand(50, width()-50);
                let ty = rand(100, height()-150);
                add([ rect(20, 40), color(60, 30, 10), pos(tx, ty), anchor("bot"), area(), body({isStatic:true}) ]);
                add([ circle(35), color(0, 80, 0), pos(tx, ty-40), anchor("center") ]);
            }
            if (globalUpdateUI) globalUpdateUI();
        });

        go("game");
    </script>
